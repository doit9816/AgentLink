name: build-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version"
        required: false
        default: "0.1.0"
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  windows:
    name: Windows package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/agentlink-desktop/package-lock.json

      - name: Build and package
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          $refName = "${{ github.ref_name }}"
          if ($refName -match '^v(.+)$') {
            $version = $Matches[1]
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "0.1.0"
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\auto-package.ps1 `
            -Version $version `
            -TargetName windows-amd64 `
            -CoreTargetDir "$env:GITHUB_WORKSPACE\target\agentlink" `
            -DesktopTargetDir "$env:GITHUB_WORKSPACE\target\agentlink-desktop"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: agentlink-windows-amd64
          path: |
            dist/*.zip
            target/agentlink-desktop/release/bundle/**
          if-no-files-found: error

      - name: Publish latest prerelease
        if: github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: AgentLink Latest Build
          body: |
            自动构建产物，对应 main 分支最新提交。

            正式版本请使用 v* tag 对应的 Release。
          prerelease: true
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          makeLatest: false
          artifacts: "dist/*.zip,target/agentlink-desktop/release/bundle/msi/*.msi,target/agentlink-desktop/release/bundle/nsis/*.exe"

      - name: Publish version release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: AgentLink ${{ github.ref_name }}
          body: |
            AgentLink 自动打包正式版本。
          prerelease: false
          allowUpdates: true
          replacesArtifacts: true
          artifactErrorsFailBuild: true
          artifacts: "dist/*.zip,target/agentlink-desktop/release/bundle/msi/*.msi,target/agentlink-desktop/release/bundle/nsis/*.exe"
