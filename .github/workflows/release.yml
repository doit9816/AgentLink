name: build-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version"
        required: false
        default: "0.1.0"
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  windows:
    name: Windows package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/agentlink-desktop/package-lock.json

      - name: Build and package
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "0.1.0"
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\auto-package.ps1 `
            -Version $version `
            -TargetName windows-amd64 `
            -CoreTargetDir "$env:GITHUB_WORKSPACE\target\agentlink" `
            -DesktopTargetDir "$env:GITHUB_WORKSPACE\target\agentlink-desktop"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: agentlink-windows-amd64
          path: |
            dist/*.zip
            target/agentlink-desktop/release/bundle/**
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            target/agentlink-desktop/release/bundle/**/*
