name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: ""
            updaterTarget: windows
            updaterArch: x86_64
            updaterPlatformKey: windows-x86_64
            bundleDir: client/agentlink-desktop/src-tauri/target/release/bundle
          - name: Linux x64
            platform: ubuntu-22.04
            args: ""
            updaterTarget: linux
            updaterArch: x86_64
            updaterPlatformKey: linux-x86_64
            bundleDir: client/agentlink-desktop/src-tauri/target/release/bundle
          - name: macOS Apple Silicon
            platform: macos-latest
            args: "--target aarch64-apple-darwin"
            updaterTarget: darwin
            updaterArch: aarch64
            updaterPlatformKey: darwin-aarch64
            bundleDir: client/agentlink-desktop/src-tauri/target/aarch64-apple-darwin/release/bundle
          - name: macOS Intel
            platform: macos-latest
            args: "--target x86_64-apple-darwin"
            updaterTarget: darwin
            updaterArch: x86_64
            updaterPlatformKey: darwin-x86_64
            bundleDir: client/agentlink-desktop/src-tauri/target/x86_64-apple-darwin/release/bundle

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: client/agentlink-desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS Apple Silicon target
        if: matrix.name == 'macOS Apple Silicon'
        run: rustup target add aarch64-apple-darwin

      - name: Add macOS Intel target
        if: matrix.name == 'macOS Intel'
        run: rustup target add x86_64-apple-darwin

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            client/agentlink-desktop/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: client/agentlink-desktop
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: client/agentlink-desktop
          args: ${{ matrix.args }}
          tagName: v__VERSION__
          releaseName: AgentLink v__VERSION__
          releaseBody: |
            Download the installer or bundle for your platform from the assets below.

            macOS builds are not notarized by Apple. If Gatekeeper blocks the app, clear the quarantine attribute before opening:
            ```bash
            xattr -dr com.apple.quarantine ~/Downloads/AgentLink_*.dmg
            open ~/Downloads/AgentLink_*.dmg
            ```
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true

      - name: Stage public updater feed
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: >
          ./scripts/stage-updater-feed.ps1
          -BundleDir ./${{ matrix.bundleDir }}
          -FeedDir ./client/agentlink-desktop/src-tauri/target/updater-feed
          -BaseUrl https://raw.githubusercontent.com/${{ github.repository }}/updater-feed/${{ matrix.updaterTarget }}/${{ matrix.updaterArch }}
          -PlatformKey ${{ matrix.updaterPlatformKey }}
          -Version ${{ github.ref_name }}

      - name: Upload updater feed artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: updater-feed-${{ matrix.updaterTarget }}-${{ matrix.updaterArch }}
          path: client/agentlink-desktop/src-tauri/target/updater-feed
          if-no-files-found: error

  publish-updater-feed:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download updater feed artifacts
        uses: actions/download-artifact@v4
        with:
          path: updater-feed-artifacts
          pattern: updater-feed-*

      - name: Publish updater feed branch
        shell: pwsh
        run: |
          $branch = "updater-feed"
          $artifactsRoot = Resolve-Path ".\updater-feed-artifacts"
          $worktreeDir = Join-Path $env:RUNNER_TEMP $branch

          if (Test-Path -LiteralPath $worktreeDir) {
            Remove-Item -LiteralPath $worktreeDir -Recurse -Force
          }

          git fetch origin $branch
          if ($LASTEXITCODE -eq 0) {
            git worktree add --force $worktreeDir "origin/$branch"
          }
          else {
            git worktree add --detach $worktreeDir
            Push-Location $worktreeDir
            git checkout --orphan $branch
            Pop-Location
          }

          Get-ChildItem -LiteralPath $worktreeDir -Force |
            Where-Object { $_.Name -ne ".git" } |
            Remove-Item -Recurse -Force

          Get-ChildItem -LiteralPath $artifactsRoot -Directory | ForEach-Object {
            if ($_.Name -notmatch '^updater-feed-(.+)-(.+)$') {
              throw "Unexpected updater artifact directory name: $($_.Name)"
            }

            $target = $Matches[1]
            $arch = $Matches[2]
            $destinationDir = Join-Path $worktreeDir $target
            $destinationDir = Join-Path $destinationDir $arch

            New-Item -ItemType Directory -Force -Path $destinationDir | Out-Null
            Copy-Item -LiteralPath (Join-Path $_.FullName "*") -Destination $destinationDir -Recurse -Force
          }

          Push-Location $worktreeDir
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Publish updater feed for $env:GITHUB_REF_NAME"
            git push origin HEAD:$branch
          }
          else {
            Write-Host "Updater feed branch already up to date."
          }
          Pop-Location
